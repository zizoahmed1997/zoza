<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoza Together ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(145deg,#f8eef2,#e9ccd7);color:#432432;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:22px}.card{background:#fffffff0;border-radius:28px;padding:28px;box-shadow:0 18px 50px #5b203822}.lobby{max-width:520px;margin:auto}.input,button{width:100%;padding:14px;margin:7px 0;border-radius:16px;border:1px solid #d88da8;font-size:16px}.btn{background:#963b5e;color:white;border:0;font-weight:800;cursor:pointer}.ghost{background:white;color:#963b5e}.out{margin-top:12px;padding:12px;background:#f8eef2;border-radius:14px;min-height:44px}.game{display:none}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1fr 280px;gap:14px;margin-top:14px}canvas{width:100%;border:2px solid #963b5e;border-radius:18px;background:#f7dce5}.chat{height:420px;border:1px solid #e1b2c3;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.msgs{flex:1;overflow:auto;padding:10px}.msg{background:#f8eef2;padding:8px;border-radius:12px;margin:5px}.send{display:flex;padding:8px;gap:5px}.send input{margin:0}.send button{width:auto;margin:0}.controls{display:flex;gap:8px}.controls button{width:auto;flex:1}@media(max-width:720px){.layout{grid-template-columns:1fr}.chat{height:260px}}</style></head><body><div class="wrap"><div class="card">
<div id="lobby" class="lobby"><h1>💗 Zoza Together</h1><small>NEW CLEAN BUILD 03</small><p>العبوا واتكلموا مع بعض في نفس الغرفة ❤️</p><input class="input" id="name" value="Zizo"><button class="btn" id="create">✨ إنشاء غرفة خاصة</button><div style="text-align:center">أو</div><input class="input" id="code" placeholder="كود الغرفة"><button class="ghost" id="join">دخول الغرفة ❤️</button><div id="out" class="out">جاهز ❤️</div></div>
<div id="game" class="game"><div class="top"><h2>Room: <span id="roomCode"></span></h2><b id="score">❤️ 0 / 8</b></div><div class="layout"><div><canvas id="cv" width="600" height="400"></canvas><div class="controls"><button id="left">◀</button><button id="jump">⬆ قفز</button><button id="right">▶</button></div></div><div class="chat"><div id="msgs" class="msgs"></div><div class="send"><input class="input" id="msg" placeholder="اكتب رسالة"><button class="btn" id="send">إرسال</button></div></div></div></div>
</div></div><script>
const BASE='https://rkebomshpuwllklvfpaw.supabase.co/rest/v1/',KEY='sb_publishable_WXN_0YbN-zOluH_4-EmazQ_nWzk0m7d';
const $=x=>document.getElementById(x);let room='',name='',pid='p'+Date.now()+Math.random().toString(36).slice(2),x=40,y=300,vy=0,L=false,R=false,on=false,hearts=0;
async function api(path,opt={}){const r=await fetch(BASE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' '+t.slice(0,180));return t?JSON.parse(t):null}
function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
$('create').onclick=async()=>{name=$('name').value.trim()||'Zizo';room=code();$('out').textContent='⏳ جاري إنشاء الغرفة...';try{await api('rooms',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code:room,host_id:pid})});await enter()}catch(e){$('out').textContent='❌ '+e.message}};
$('join').onclick=async()=>{name=$('name').value.trim()||'Zoza';room=$('code').value.trim().toUpperCase();if(!room)return $('out').textContent='اكتب كود الغرفة';$('out').textContent='⏳ جاري الدخول...';try{let a=await api('rooms?code=eq.'+encodeURIComponent(room)+'&select=code,hearts');if(!a.length)throw Error('الغرفة غير موجودة');hearts=a[0].hearts||0;await enter()}catch(e){$('out').textContent='❌ '+e.message}};
async function enter(){await api('players',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:pid,room_code:room,name:name,avatar:name.toLowerCase().includes('zoza')?'👩🏻':'🧑🏻',x:x,y:y})});$('lobby').style.display='none';$('game').style.display='block';$('roomCode').textContent=room;poll();requestAnimationFrame(loop)}
async function poll(){if(!$('game')||$('game').style.display==='none')return;try{let rr=await api('rooms?code=eq.'+encodeURIComponent(room)+'&select=hearts');if(rr.length){hearts=rr[0].hearts;$('score').textContent='❤️ '+hearts+' / 8'}let m=await api('messages?room_code=eq.'+encodeURIComponent(room)+'&select=player_name,body&order=created_at.asc&limit=50');$('msgs').innerHTML=m.map(z=>'<div class="msg"><b>'+esc(z.player_name)+':</b> '+esc(z.body)+'</div>').join('')}catch(e){}setTimeout(poll,1500)}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('send').onclick=async()=>{let b=$('msg').value.trim();if(!b)return;$('msg').value='';await api('messages',{method:'POST',body:JSON.stringify({room_code:room,player_id:pid,player_name:name,body:b})})};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
const cv=$('cv'),ctx=cv.getContext('2d'),plats=[{x:0,y:350,w:210},{x:270,y:350,w:230},{x:560,y:350,w:250},{x:870,y:350,w:250},{x:1180,y:350,w:300},{x:180,y:270,w:100},{x:430,y:230,w:110},{x:720,y:280,w:100},{x:1000,y:220,w:120},{x:1280,y:270,w:100}];let cam=0,last=0;
function loop(t){if(L)x-=4;if(R)x+=4;vy+=.6;y+=vy;on=false;plats.forEach(p=>{if(vy>=0&&x+25>p.x&&x<p.x+p.w&&y+35>=p.y&&y+35<=p.y+18){y=p.y-35;vy=0;on=true}});if(y>430){x=40;y=290;vy=0}x=Math.max(0,Math.min(1450,x));cam=Math.max(0,Math.min(900,x-220));draw();if(t-last>350){last=t;api('players?id=eq.'+encodeURIComponent(pid),{method:'PATCH',body:JSON.stringify({x:x,y:y,last_seen:new Date().toISOString()})}).catch(()=>{})}requestAnimationFrame(loop)}
function draw(){ctx.fillStyle='#f7dce5';ctx.fillRect(0,0,600,400);ctx.save();ctx.translate(-cam,0);plats.forEach(p=>{ctx.fillStyle='#8f3a5b';ctx.fillRect(p.x,p.y,p.w,50)});for(let i=hearts;i<8;i++){let hx=150+i*165,hy=180+(i%3)*45;ctx.font='27px Arial';ctx.fillText('❤️',hx,hy);if(Math.abs(x-hx)<30&&Math.abs(y-hy)<45)takeHeart()}ctx.font='30px Arial';ctx.fillText(name.toLowerCase().includes('zoza')?'👩🏻':'🧑🏻',x,y+30);ctx.fillStyle='#963b5e';ctx.fillRect(1430,270,50,80);ctx.fillText('💗',1440,310);ctx.restore()}
let taking=false;async function takeHeart(){if(taking||hearts>=8)return;taking=true;hearts++;$('score').textContent='❤️ '+hearts+' / 8';await api('rooms?code=eq.'+encodeURIComponent(room),{method:'PATCH',body:JSON.stringify({hearts:hearts})}).catch(()=>{});setTimeout(()=>taking=false,400)}
function hold(id,k){let b=$(id);b.onpointerdown=e=>{e.preventDefault();if(k==='L')L=true;else R=true};b.onpointerup=b.onpointerleave=()=>{if(k==='L')L=false;else R=false}}hold('left','L');hold('right','R');$('jump').onpointerdown=e=>{e.preventDefault();if(on){vy=-12;on=false}};
</script></body></html>
